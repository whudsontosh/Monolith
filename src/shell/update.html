<!doctype html>
<html lang="en" data-role="update">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Updating Monolith</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0;background:#000;color:#ecebe6}
/*CSS*/
</style>
</head>
<body>
<div class="upd">
  <span class="upd-slab" aria-hidden="true"><i id="upd-fill"></i></span>
  <div class="upd-main">
    <h1 id="upd-title">Updating Monolith</h1>
    <p class="muted" id="upd-sub">Getting the new version…</p>
    <div class="upd-meta" id="upd-meta"></div>
    <div class="upd-notes" id="upd-notes"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" id="upd-skip">Skip this time</button></div>
  </div>
</div>
<script>
"use strict";
const D=window.monolithDesk&&window.monolithDesk.claim();
const $=id=>document.getElementById(id);
const mb=n=>(n/1048576).toFixed(1)+" MB";
$("upd-skip").onclick=()=>D&&D.updateSkip();
if(D)D.onUpdate(s=>{
  $("upd-title").textContent=`Updating to Monolith ${s.version||""}`;
  if(s.notes)$("upd-notes").textContent=s.notes;
  if(s.state==="downloading"){$("upd-sub").textContent=`You have ${s.current}. Downloading the new version…`;$("upd-fill").style.height=(s.pct||0)+"%";$("upd-meta").textContent=s.total?`${mb(s.got||0)} of ${mb(s.total)}`:""}
  if(s.state==="verifying"){$("upd-sub").textContent="Checking the download against Monolith's signing key…";$("upd-fill").style.height="100%"}
  if(s.state==="installing"){$("upd-sub").textContent="Installing. Monolith reopens by itself in a moment.";$("upd-fill").style.height="100%";$("upd-skip").hidden=true}
  if(s.state==="error"){$("upd-sub").textContent="The update didn't finish: "+(s.msg||"unknown error")+". Monolith keeps working on the version you have.";$("upd-skip").textContent="Close"}
});
</script>
</body>
</html>
